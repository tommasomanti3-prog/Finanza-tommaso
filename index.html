
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finanze Tommaso PRO MAX</title>
<style>
body { font-family: Arial, sans-serif; margin:0; padding:0; background:#0f172a; color:white; }
header { padding:15px; background:#111827; text-align:center; }
section { padding:15px; }
input, select, button { padding:8px; margin:5px 0; border-radius:8px; border:none; }
table { width:100%; border-collapse: collapse; margin-top:10px; }
td, th { border:1px solid #334155; padding:6px; text-align:center; }
.card { background:#1e293b; padding:12px; border-radius:12px; margin-bottom:15px; }
.progress { height:20px; background:#334155; border-radius:10px; overflow:hidden; }
.progress-bar { height:100%; background:#22c55e; width:0%; }
</style>
</head>
<body>

<header>
<h2>Finanze Tommaso PRO MAX</h2>
</header>

<section id="login">
<div class="card">
<h3>Password</h3>
<input type="password" id="password" placeholder="Inserisci password">
<button onclick="checkLogin()">Entra</button>
</div>
</section>

<section id="app" style="display:none;">

<div class="card">
<h3>Obiettivo 10.000€</h3>
<p>Risparmi attuali: <span id="risparmi">0</span> €</p>
<div class="progress"><div class="progress-bar" id="bar"></div></div>
<p id="percent"></p>
<p id="previsione"></p>
</div>

<div class="card">
<h3>Inserisci Spesa Giornaliera</h3>
<input type="date" id="data">
<input type="number" id="importo" placeholder="Importo €">
<select id="categoria">
<option>Spesa</option>
<option>Benzina</option>
<option>Amici</option>
<option>Bollette</option>
<option>Extra</option>
</select>
<button onclick="addSpesa()">Aggiungi</button>
</div>

<div class="card">
<h3>Totale Mensile</h3>
<p>Entrate: 2000 €</p>
<p>Spese: <span id="totaleSpese">0</span> €</p>
<p>Risultato: <span id="risultato"></span></p>
<button onclick="chiudiMese()">Chiudi Mese</button>
</div>

<div class="card">
<h3>Grafico per Categoria</h3>
<canvas id="grafico" width="300" height="200"></canvas>
</div>

</section>

<script>
const PASSWORD = "Tommaso0193";
let spese = JSON.parse(localStorage.getItem("spese") || "[]");
let risparmi = Number(localStorage.getItem("risparmi") || 0);

function checkLogin() {
  if(document.getElementById("password").value === PASSWORD) {
    document.getElementById("login").style.display="none";
    document.getElementById("app").style.display="block";
    aggiorna();
  } else {
    alert("Password errata");
  }
}

function addSpesa() {
  const data = document.getElementById("data").value;
  const importo = Number(document.getElementById("importo").value);
  const categoria = document.getElementById("categoria").value;
  if(!data || !importo) return;
  spese.push({data, importo, categoria});
  localStorage.setItem("spese", JSON.stringify(spese));
  aggiorna();
}

function aggiorna() {
  const totale = spese.reduce((a,b)=>a+b.importo,0);
  document.getElementById("totaleSpese").innerText = totale.toFixed(2);
  
  const risultato = 2000 - totale;
  document.getElementById("risultato").innerText = risultato.toFixed(2) + " €";
  
  document.getElementById("risparmi").innerText = risparmi.toFixed(2);
  
  const percent = Math.min((risparmi/10000)*100,100);
  document.getElementById("bar").style.width = percent+"%";
  document.getElementById("percent").innerText = percent.toFixed(1)+"% completato";
  
  previsione10k();
  graficoCategorie();
}

function chiudiMese() {
  const totale = spese.reduce((a,b)=>a+b.importo,0);
  const risultato = 2000 - totale;
  risparmi += Math.max(risultato,0);
  localStorage.setItem("risparmi", risparmi);
  alert("Mese chiuso. Risparmio aggiunto: "+Math.max(risultato,0).toFixed(2)+"€");
  aggiorna();
}

function previsione10k() {
  if(risparmi <= 0) return;
  const mesi = Math.ceil((10000 - risparmi) / risparmi);
  const oggi = new Date();
  oggi.setMonth(oggi.getMonth()+mesi);
  document.getElementById("previsione").innerText = "Previsione 10k: " + oggi.toLocaleDateString();
}

function graficoCategorie() {
  const canvas = document.getElementById("grafico");
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0,0,300,200);
  
  const categorie = {};
  spese.forEach(s=>{
    categorie[s.categoria] = (categorie[s.categoria]||0)+s.importo;
  });
  
  const keys = Object.keys(categorie);
  const values = Object.values(categorie);
  const total = values.reduce((a,b)=>a+b,0);
  
  let start = 0;
  keys.forEach((k,i)=>{
    const slice = values[i]/total * Math.PI*2;
    ctx.beginPath();
    ctx.moveTo(150,100);
    ctx.arc(150,100,80,start,start+slice);
    start += slice;
    ctx.fill();
  });
}

// Notifica promemoria
if ("Notification" in window) {
  Notification.requestPermission().then(p=>{
    if(p==="granted") {
      setTimeout(()=>{
        new Notification("Promemoria: inserisci le spese di oggi 💰");
      }, 5000);
    }
  });
}

aggiorna();
</script>

</body>
</html>
